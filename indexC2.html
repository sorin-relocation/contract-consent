<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f40"><title>ご依頼内容の確認｜SŌRIN Relocation</title>
<style>
:root{--navy:#102f40;--teal:#167d78;--gold:#d4af37;--ink:#20313a;--muted:#71818a;--line:#e4eaed;--bg:#f4f7f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:0 auto;padding:20px 14px 40px}.brand{font-size:12px;letter-spacing:.14em;color:var(--teal);font-weight:800;margin:4px 0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 13px;box-shadow:0 4px 16px #102f400a}h1{font-size:21px;color:var(--navy);margin:0 0 8px}h2{font-size:15px;margin:0 0 12px;color:var(--navy)}.muted{font-size:12px;color:var(--muted);line-height:1.6}.amount{font-size:27px;font-weight:850;color:#8b6b26;margin:8px 0}.row{display:grid;grid-template-columns:100px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #eef1f2;font-size:13px}.row:last-child{border:0}.key{color:var(--muted)}.value{white-space:pre-wrap;overflow-wrap:anywhere}.terms{margin-top:10px}.term{display:flex;gap:8px;padding:12px 0;border-bottom:1px solid #eef1f2;font-size:14px;line-height:1.6}.term:last-child{border:0}.term b{flex:0 0 18px;color:var(--teal)}.check{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #eef1f2;font-size:14px;line-height:1.55}.check:last-child{border:0}.final-check{border-top:1px solid var(--line);margin-top:8px;padding-top:16px;font-weight:700}.check input{width:21px;height:21px;flex:0 0 21px;margin:1px 0 0;accent-color:var(--teal)}button{width:100%;border:0;border-radius:11px;background:var(--teal);color:#fff;padding:15px;font-size:15px;font-weight:750;margin-top:16px}button:disabled{opacity:.45}#status{padding:14px;border-radius:10px;background:#edf4f3;color:#315c59;font-size:13px;line-height:1.6}.error{background:#fff0f0!important;color:#a33!important}.done{text-align:center;padding:30px 15px}.done strong{display:block;font-size:19px;color:var(--teal);margin-bottom:8px}@media(max-width:420px){.row{grid-template-columns:84px 1fr}}
</style></head><body><main class="wrap"><div class="brand">SŌRIN RELOCATION</div><section class="card"><h1>お引越しのご依頼内容の確認</h1><div class="muted">以下のご依頼内容・作業日・予約時間枠・金額をご確認ください。内容をご確認のうえ、一番下の同意チェックを入れて確定すると、ご依頼が確定します。</div></section><div id="status">LINE認証・ご依頼内容を確認しています…</div><div id="content" hidden></div></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
const SUPABASE_URL='https://raelrzegewoftknalsws.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_2Hzm21bczQC7uhCtrGHn1Q_8OhA_K9o';
const LIFF_ID='2011341352-x3q6RKzI';
function readConsentToken(){
  const params=new URLSearchParams(location.search);
  const direct=params.get('token');
  if(direct) return direct;

  // LIFF may move the original query string into liff.state.
  const state=params.get('liff.state');
  if(state){
    const candidates=[state];
    try{candidates.push(decodeURIComponent(state));}catch(_e){}
    for(const candidate of candidates){
      try{
        const parsed=new URL(candidate,location.origin);
        const nested=parsed.searchParams.get('token');
        if(nested) return nested;
      }catch(_e){}
      if(candidate.startsWith('?')){
        const nested=new URLSearchParams(candidate.slice(1)).get('token');
        if(nested) return nested;
      }
    }
  }
  return '';
}
const token=readConsentToken();
const statusEl=document.getElementById('status'),content=document.getElementById('content');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(body){const r=await fetch(SUPABASE_URL+'/functions/v1/contract-consent',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'通信に失敗しました');return d;}
function rows(c){const arr=[['受付番号',c.caseNo],['お名前',c.customerName+' 様'],['電話番号',c.customerPhone||'未登録'],['プラン',c.plan],['作業日・時間枠',(c.workStartAt?new Date(c.workStartAt).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo'}):'未設定')+' '+(c.workSlot||'未設定')],['搬出元',c.from||'未入力'],['立寄所',(c.stops||[]).map(v=>v.name+'：'+v.address).join('\n')||'なし'],['搬入先',c.to||'未入力'],['お荷物・作業内容',[...(c.tasks||[]),...(c.items||[])].join('\n')||c.details||'未入力']];return arr.map(([k,v])=>`<div class="row"><div class="key">${esc(k)}</div><div class="value">${esc(v)}</div></div>`).join('');}
async function start(){try{if(!token)throw new Error('同意URLが正しくありません');await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()&&!liff.isInClient()){liff.login({redirectUri:location.href});return;}const idToken=liff.getIDToken();if(!idToken)throw new Error('LINE認証情報を取得できません。LINEアプリから開き直してください。');const d=await api({action:'get',token});const c=d.contract;content.innerHTML=`<section class="card"><h2>ご依頼内容</h2>${rows(c)}<div class="muted" style="margin-top:12px">確定見積金額（税込）</div><div class="amount">${Number(c.quoteAmount).toLocaleString('ja-JP')}円</div></section><section class="card"><h2>ご確認事項</h2><div class="muted">以下の内容をご確認ください。</div><div class="terms">${c.agreements.map((v,i)=>{const link=i===1?c.privacyPolicyUrl:i===2?c.cancellationPolicyUrl:'';const text=esc(v)+(link?` <a href="${esc(link)}" target="_blank" rel="noopener noreferrer">内容を確認</a>`:'');return `<div class="term"><b>${i+1}.</b> <span>${text}</span></div>`}).join('')}</div><label class="check final-check"><input type="checkbox" id="agreeAll"><span>上記すべての内容を確認し、同意します。</span></label><button id="agree" disabled>同意してご依頼を確定する</button></section>`;content.hidden=false;statusEl.hidden=true;const agreeAll=document.getElementById('agreeAll'),button=document.getElementById('agree');const update=()=>button.disabled=!agreeAll.checked;agreeAll.addEventListener('change',update);button.addEventListener('click',async()=>{button.disabled=true;button.textContent='確定処理中…';try{const result=await api({action:'consent',token,idToken,checkedItems:c.agreements.map(()=>true)});content.innerHTML=`<section class="card done"><strong>ご依頼が確定しました</strong><div>受付番号：${esc(result.caseNo)}</div><p class="muted">ご同意ありがとうございます。SŌRIN Relocationより改めてご案内いたします。</p></section>`;}catch(e){button.disabled=false;button.textContent='同意してご依頼を確定する';statusEl.hidden=false;statusEl.className='error';statusEl.textContent=e.message;}});
}catch(e){statusEl.className='error';statusEl.textContent=e.message||String(e);}}
start();
</script></body></html>
