<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f40"><title>ご依頼内容の確認｜SŌRIN Relocation</title>
<style>
:root{--navy:#102f40;--teal:#167d78;--gold:#d4af37;--ink:#20313a;--muted:#71818a;--line:#e4eaed;--bg:#f4f7f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:0 auto;padding:20px 14px 40px}.brand{font-size:12px;letter-spacing:.14em;color:var(--teal);font-weight:800;margin:4px 0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 13px;box-shadow:0 4px 16px #102f400a}h1{font-size:21px;color:var(--navy);margin:0 0 8px}h2{font-size:15px;margin:0 0 12px;color:var(--navy)}.muted{font-size:12px;color:var(--muted);line-height:1.6}.payment-method-select{margin:16px 0 4px;padding:12px 0;border-top:1px solid var(--line)}.payment-method-select label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.payment-method-select select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:14px}.payment-method-select p{margin:6px 0 0;font-size:11px;color:var(--muted);line-height:1.5}.amount-wrap{display:flex;align-items:baseline;justify-content:flex-end;gap:12px;margin-top:12px}.amount-label{font-size:12px;color:var(--muted);line-height:1.6;white-space:nowrap}.amount{display:flex;align-items:baseline;justify-content:flex-end;gap:5px;font-size:27px;font-weight:850;color:#8b6b26;margin:0}.amount small{font-size:13px;font-weight:600}.row{display:grid;grid-template-columns:minmax(72px,88px) minmax(0,1fr);gap:8px;padding:11px 0;border-bottom:1px solid #eef1f2;font-size:14px;align-items:start}.row:last-child{border:0}.key{color:var(--muted);font-size:12px;line-height:1.65}.value{min-width:0;white-space:pre-line;overflow-wrap:break-word;word-break:normal;line-height:1.7}.address-line{display:block}.detail-line{display:block;margin:0 0 4px}.detail-label{color:var(--muted);font-size:12px;margin-right:6px}@media(max-width:420px){.row{grid-template-columns:72px minmax(0,1fr);gap:8px;font-size:14px}}
.choko-detail-groups{margin-top:8px}
.choko-detail-group{padding:13px 0 12px}
.choko-detail-group+.choko-detail-group{border-top:2px solid var(--gold)}
.choko-detail-title{font-size:15px;font-weight:750;color:var(--navy);line-height:1.6;margin:0 0 7px}
.choko-detail-body{font-size:14px;line-height:1.75;white-space:pre-line;overflow-wrap:anywhere}
.choko-detail-group:first-child{padding-top:0}
.terms{margin-top:10px}.term{display:flex;gap:8px;padding:12px 0;border-bottom:1px solid #eef1f2;font-size:14px;line-height:1.6}.term:last-child{border:0}.term b{flex:0 0 18px;color:var(--teal)}.check{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #eef1f2;font-size:14px;line-height:1.55}.check:last-child{border:0}.final-check{border-top:1px solid var(--line);margin-top:8px;padding-top:16px;font-weight:700}.check input{width:21px;height:21px;flex:0 0 21px;margin:1px 0 0;accent-color:var(--teal)}button{width:100%;border:0;border-radius:11px;background:var(--teal);color:#fff;padding:15px;font-size:15px;font-weight:750;margin-top:16px}button:disabled{opacity:.45}#status{padding:14px;border-radius:10px;background:#edf4f3;color:#315c59;font-size:13px;line-height:1.6}.error{background:#fff0f0!important;color:#a33!important}.done{text-align:center;padding:30px 15px}.done strong{display:block;font-size:19px;color:var(--teal);margin-bottom:8px}
</style></head><body><main class="wrap"><div class="brand">SŌRIN RELOCATION</div><section class="card"><h1>お引越しのご依頼内容の確認</h1><div class="muted">以下のご依頼内容・作業日・開始予定・金額をご確認ください。内容をご確認のうえ、一番下の同意チェックを入れて確定すると、ご依頼が確定します。</div></section><div id="status">LINE認証・ご依頼内容を確認しています…</div><div id="content" hidden></div></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
const SUPABASE_URL='https://raelrzegewoftknalsws.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_2Hzm21bczQC7uhCtrGHn1Q_8OhA_K9o';
const LIFF_ID='2011341352-x3q6RKzI';
function readConsentToken(){
  const params=new URLSearchParams(location.search);
  const direct=params.get('token');
  if(direct) return direct;

  // LIFF may move the original query string into liff.state.
  const state=params.get('liff.state');
  if(state){
    const candidates=[state];
    try{candidates.push(decodeURIComponent(state));}catch(_e){}
    for(const candidate of candidates){
      try{
        const parsed=new URL(candidate,location.origin);
        const nested=parsed.searchParams.get('token');
        if(nested) return nested;
      }catch(_e){}
      if(candidate.startsWith('?')){
        const nested=new URLSearchParams(candidate.slice(1)).get('token');
        if(nested) return nested;
      }
    }
  }
  return '';
}
const token=readConsentToken();
const statusEl=document.getElementById('status'),content=document.getElementById('content');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(body){const r=await fetch(SUPABASE_URL+'/functions/v1/contract-consent',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'通信に失敗しました');return d;}
function addressHtml(value){
  const text=String(value??'').trim();
  if(!text)return '未入力';
  // Postal code on its own line, street address on the next, building on the last.
  const postalMatch=text.match(/^(?:〒\s*)?(\d{3}-?\d{4})\s+(.+)$/);
  const postal=postalMatch?postalMatch[1]:'';
  const address=postalMatch?postalMatch[2].trim():text;
  // Split after the street number when a trailing building / room segment exists.
  const streetMatch=address.match(/^(.+?\s+\d+[丁目番地号]*(?:-\d+[番地号]*)*)(?:\s+(.+))?$/);
  const street=streetMatch?streetMatch[1]:address;
  const building=streetMatch?String(streetMatch[2]||'').trim():'';
  return `${postal?`<span class="address-line">〒${esc(postal)}</span>`:''}<span class="address-line">${esc(street)}</span>${building?`<span class="address-line">${esc(building)}</span>`:''}`;
}
function valueRow(label,value,kind='text'){
  let rendered=kind==='address'?addressHtml(value):esc(value??'');
  return `<div class="row"><div class="key">${esc(label)}</div><div class="value">${rendered||'未入力'}</div></div>`;
}
function rows(c){
  const isChoko=String(c.plan||'').includes('ちょこ楽');
  const date=c.workStartAt?new Date(c.workStartAt).toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',timeZone:'Asia/Tokyo'}):'未設定';
  const arr=[];
  arr.push(valueRow('受付番号',c.caseNo));
  arr.push(valueRow('お名前',`${c.customerName||''} 様`));
  arr.push(valueRow('電話番号',c.customerPhone||'未登録'));
  arr.push(valueRow('プラン',c.plan||'未設定'));
  arr.push(`<div class="row"><div class="key">作業日<br>開始予定</div><div class="value"><div>${esc(date)}</div><div>${esc(c.workSlot||'未設定')}</div></div></div>`);
  if(isChoko){
    arr.push(valueRow('作業場所',c.from||'未入力','address'));
  }else{
    arr.push(valueRow('搬出元',c.from||'未入力','address'));
    if(Array.isArray(c.stops)&&c.stops.length){
      const stops=c.stops.map((v,i)=>`<div class="detail-line"><span class="detail-label">${esc(v.name||`立寄所${i+1}`)}</span>${addressHtml(v.address)}</div>`).join('');
      arr.push(`<div class="row"><div class="key">立寄所</div><div class="value">${stops}</div></div>`);
    }
    arr.push(valueRow('搬入先',c.to||'未入力','address'));
  }
  const itemText=typeof c.items==='string'?c.items.trim().replace(/\s*\/\s*/g,'\n'):
    Array.isArray(c.items)?c.items.map(v=>typeof v==='string'?v:[v.name||v.item,v.quantity?`×${v.quantity}`:''].filter(Boolean).join(' ')).filter(Boolean).join('\n'):'';
  const taskList=Array.isArray(c.tasks)?c.tasks.map(v=>String(v??'').trim()).filter(Boolean):[];
  const rawDetails=String(c.details??'').trim();

  if(isChoko){
    // Choko details are grouped under the selected work-item titles.
    const definitions=[
      {title:'家具・家電の移動／模様替え',marker:/^移動する物\s*\d+$/},
      {title:'家具の組み立て',marker:/^組み立てる家具\s*\d+$/},
      {title:'家具・家電の設置',marker:/^設置する物\s*\d+$/},
      {title:'荷物の積み下ろし作業',marker:/^荷物\s*\d+$/},
      {title:'荷造り・荷解き',marker:/^(?:荷造り・荷解き|荷造り|荷解き)(?:\s*\d+)?$/},
      {title:'その他',marker:/^その他(?:の作業)?(?:\s*\d+)?$/}
    ];
    const groups=new Map();
    definitions.forEach(d=>groups.set(d.title,[]));
    const extra=[];
    let currentTitle='';
    const lines=rawDetails?rawDetails.split(/\r?\n/).map(v=>v.trim()).filter(Boolean):[];
    for(const line of lines){
      // Keep packing/unpacking and miscellaneous work in their own sections,
      // even when their detail lines follow another task in older snapshots.
      if(/^(?:荷造り・荷解きの補足|荷造りの補足|荷解きの補足|作業時間)\s*[:：]/.test(line)){
        groups.get('荷造り・荷解き').push(line);
        continue;
      }
      if(/^(?:その他の作業内容|その他の補足|全体の備考)\s*[:：]/.test(line)){
        groups.get('その他').push(line);
        continue;
      }
      const markerDef=definitions.find(d=>d.marker.test(line));
      if(markerDef){
        currentTitle=markerDef.title;
        continue;
      }
      const legacyAssembly=line.match(/^assembly\s*(\d+)\s*\/\s*values\s*(1|2)\s*[:：]\s*(.*)$/i);
      const legacyNote=line.match(/^assemblyNote\s*[:：]\s*(.*)$/i);
      if(legacyAssembly){
        currentTitle='家具の組み立て';
        const groupKey=`__assembly_${legacyAssembly[1]}`;
        if(!groups.has(groupKey))groups.set(groupKey,[]);
        groups.get(groupKey).push(`${legacyAssembly[2]==='1'?'組み立てる家具':'個数'}：${legacyAssembly[3].trim()}`);
      }else if(legacyNote){
        if(legacyNote[1].trim())extra.push(`補足：${legacyNote[1].trim()}`);
      }else if(/^その他の(?:作業内容|補足)\s*[:：]/.test(line)){
        currentTitle='その他';
        groups.get('その他').push(line);
      }else if(/^全体の備考\s*[:：]/.test(line)){
        groups.get('その他').push(line);
      }else if(currentTitle && groups.has(currentTitle)){
        groups.get(currentTitle).push(line);
      }else{
        extra.push(line);
      }
    }
    const rendered=[];
    const cleanChokoDetailLine=line=>String(line??'').replace(/^(?:移動したい物|組み立てる家具|設置する物|荷物の種類)\s*[:：]\s*/, '');
    const seenTitles=new Set();
    for(const title of taskList){
      const matching=definitions.find(d=>d.title===title || (title==='家具・家電の移動 / 模様替え'&&d.title==='家具・家電の移動／模様替え'));
      if(!matching)continue;
      const body=groups.get(matching.title)||[];
      rendered.push({title,body:body.map(cleanChokoDetailLine).join('\n')});
      seenTitles.add(matching.title);
    }
    // Include populated detail groups missing from older task snapshots.
    for(const d of definitions){
      const body=groups.get(d.title)||[];
      if(body.length&&!seenTitles.has(d.title)){
        rendered.push({title:d.title,body:body.map(cleanChokoDetailLine).join('\n')});
        seenTitles.add(d.title);
      }
    }
    for(const [key,body] of groups){
      if(key.startsWith('__assembly_')&&body.length)rendered.push({title:'家具の組み立て',body:body.join('\n')});
    }
    if(extra.length)rendered.push({title:'その他',body:extra.join('\n')});
    if(rendered.length){
      const groupHtml=rendered.map(g=>`<div class="choko-detail-group"><div class="choko-detail-title">${esc(g.title)}</div>${g.body?`<div class="choko-detail-body">${esc(g.body)}</div>`:''}</div>`).join('');
      arr.push(`<div class="row"><div class="key">内容詳細</div><div class="value"><div class="choko-detail-groups">${groupHtml}</div></div></div>`);
    }else if(taskList.length){
      const groupHtml=taskList.map(title=>`<div class="choko-detail-group"><div class="choko-detail-title">${esc(title)}</div></div>`).join('');
      arr.push(`<div class="row"><div class="key">内容詳細</div><div class="value"><div class="choko-detail-groups">${groupHtml}</div></div></div>`);
    }else if(itemText){
      arr.push(valueRow('内容詳細',itemText));
    }
  }else{
    if(itemText)arr.push(valueRow('お荷物',itemText));
    const taskText=taskList.join('\n');
    if(taskText && taskText!==itemText)arr.push(valueRow('作業内容',taskText));
    if(rawDetails && rawDetails!==itemText && rawDetails!==taskText){
      const lines=rawDetails.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
      const assemblyGroups=new Map();
      const otherDetails=[];
      for(const line of lines){
        const match=line.match(/^assembly\s*(\d+)\s*\/\s*values\s*(1|2)\s*[:：]\s*(.*)$/i);
        const note=line.match(/^assemblyNote\s*[:：]\s*(.*)$/i);
        if(match){
          const group=Number(match[1]);
          if(!assemblyGroups.has(group))assemblyGroups.set(group,{});
          assemblyGroups.get(group)[match[2]==='1'?'name':'quantity']=match[3].trim();
        }else if(note){
          if(note[1].trim())otherDetails.push(`備考：${note[1].trim()}`);
        }else{
          otherDetails.push(line);
        }
      }
      const assemblyLines=[...assemblyGroups.entries()].sort((a,b)=>a[0]-b[0]).map(([,v])=>{
        const name=v.name||'';const quantity=v.quantity||'';
        return name&&quantity?`${name}：${quantity}`:name||quantity;
      }).filter(Boolean);
      const detailLines=[...assemblyLines,...otherDetails];
      if(detailLines.length){
        const heading=assemblyLines.length?'家具の組み立て内容':'補足・作業内容';
        arr.push(valueRow(heading,detailLines.join('\n')));
      }
    }
    if(!itemText&&!taskList.length&&!rawDetails)arr.push(valueRow('お荷物・作業内容','未入力'));
  }
  return arr.join('');
}
async function start(){try{if(!token)throw new Error('同意URLが正しくありません');await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()&&!liff.isInClient()){liff.login({redirectUri:location.href});return;}const idToken=liff.getIDToken();if(!idToken)throw new Error('LINE認証情報を取得できません。LINEアプリから開き直してください。');const d=await api({action:'get',token});const c=d.contract;content.innerHTML=`<section class="card"><h2>ご依頼内容</h2>${rows(c)}<div class="payment-method-select"><label for="paymentMethod">お支払い方法</label><select id="paymentMethod" required><option value="">選択してください</option><option value="現金">現金</option><option value="クレジットカード">クレジットカード</option><option value="電子マネー">電子マネー</option><option value="QRコード決済">QRコード決済</option></select><p>お支払いは作業当日のみとなります。決済方法は後から変更できます。</p></div><div class="amount-wrap"><div class="amount-label">確定金額 <span id="selectedPaymentMethodDisplay"></span></div><div class="amount"><span>${Number(c.quoteAmount).toLocaleString('ja-JP')}円</span><small>(税込)</small></div></div></section><section class="card"><h2>ご確認事項</h2><div class="muted">以下の内容をご確認ください。</div><div class="terms"><div class="term"><b>1.</b><span>駐車スペースの確保をお願いいたします。確保が難しい場合、実際に発生した有料駐車場料金をご負担いただきます。</span></div><div class="term"><b>2.</b><span>お見積もり時と実際の荷物量・作業内容が異なる場合や、追加作業が発生した場合は、追加料金が発生することがあります。</span></div><div class="term"><b>3.</b><span>お客様のご都合などにより待機が発生した場合、状況に応じて追加料金が発生することがあります。</span></div><div class="term"><b>4.</b><span><a href="${esc(c.privacyPolicyUrl||'https://sorin-base.com/privacypolicy/')}" target="_blank" rel="noopener noreferrer">プライバシーポリシー</a>および<a href="${esc(c.cancellationPolicyUrl||'https://sorin-base.com/cancellationpolicy')}" target="_blank" rel="noopener noreferrer">キャンセルポリシー</a>をご確認ください。</span></div></div><label class="check final-check"><input type="checkbox" id="agreeAll"><span>上記すべての内容を確認し、同意します。</span></label><button id="agree" disabled>同意してご依頼を確定する</button></section>`;content.hidden=false;statusEl.hidden=true;const agreeAll=document.getElementById('agreeAll'),button=document.getElementById('agree'),paymentMethod=document.getElementById('paymentMethod');const update=()=>button.disabled=!agreeAll.checked||!paymentMethod.value;const paymentMethodDisplay=document.getElementById('selectedPaymentMethodDisplay');paymentMethod.addEventListener('change',()=>{paymentMethodDisplay.textContent=paymentMethod.value?paymentMethod.value:'';update();});agreeAll.addEventListener('change',update);button.addEventListener('click',async()=>{button.disabled=true;button.textContent='確定処理中…';try{const result=await api({action:'consent',token,idToken,paymentMethod:paymentMethod.value,checkedItems:c.agreements.map(()=>true)});content.innerHTML=`<section class="card done"><strong>ご依頼が確定しました</strong><div>受付番号：${esc(result.caseNo)}</div><p class="muted">ご同意ありがとうございます。担当者より改めてご案内いたします。</p></section>`;}catch(e){button.disabled=false;button.textContent='同意してご依頼を確定する';statusEl.hidden=false;statusEl.className='error';statusEl.textContent=e.message;}});
}catch(e){statusEl.className='error';statusEl.textContent=e.message||String(e);}}
start();
</script></body></html>
